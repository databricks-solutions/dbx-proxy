name: Build docker images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Docker and Docker Compose are available
        run: |
          set -euxo pipefail
          docker version
          docker compose version

      - name: Run dockerized tests (healthcheck)
        run: |
          set -euxo pipefail
          docker compose -f tests/docker/docker-compose.yaml up --build --abort-on-container-exit --exit-code-from test-runner

      - name: Clean up dockerized tests
        if: always()
        run: |
          set -euxo pipefail
          docker compose -f tests/docker/docker-compose.yaml down -v --remove-orphans

  docker-build:
    runs-on: ubuntu-latest
    needs: docker-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build proxy image (multi-platform, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/proxy.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
