name: Build docker images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Docker and Docker Compose are available
        run: |
          set -euxo pipefail
          docker version
          docker compose version

      - name: Run dockerized tests (healthcheck)
        run: |
          set -euxo pipefail
          docker compose -f tests/docker/docker-compose.yaml up --build --abort-on-container-exit --exit-code-from test-runner

      - name: Clean up dockerized tests
        if: always()
        run: |
          set -euxo pipefail
          docker compose -f tests/docker/docker-compose.yaml down -v --remove-orphans

  docker-build:
    runs-on: ubuntu-latest
    needs: docker-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build proxy image (multi-platform, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/proxy.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
